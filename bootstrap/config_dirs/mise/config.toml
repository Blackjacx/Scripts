[tools]
node = '26'
ruby = '4.0.2'
"gem:bundler" = '4.0.11'
"gem:jwt" = 'latest'
swiftlint = '0.62.2'                                        # A tool to enforce Swift style and conventions.
carthage = '0.40.0'                                         # Dependency manager for Apple development
tuist = '4.195.12'                                          # Create, maintain, and interact with Xcode projects at scale
fzf = 'latest'                                              # A command-line fuzzy finder
jq = 'latest'                                               # Lightweight and flexible command-line JSON processor
yq = 'latest'                                               # Portable command-line YAML, JSON, XML, CSV, TOML, HCL and properties processor
gh = 'latest'                                               # GitHub’s official command line tool
fd = 'latest'                                               # A simple, fast and user-friendly alternative to 'find'
bat = 'latest'                                              # A cat clone with wings.
starship = 'latest'                                         # Minimal, blazing-fast, and infinitely customizable prompt for any shell!
direnv = 'latest'                                           # Auto-load and -unload .envrc files
neovim = '0.12'                                             # Vim-fork focused on extensibility and usability
tree-sitter = 'latest'                                      # Required for neovim
dotenv-linter = "latest"                                    # env file linter used in neovim
go = 'latest'                                               # Reuired for neovim
xcbeautify = 'latest'                                       # A little beautifier tool for xcodebuild
claude = { version = 'latest', minimum_release_age = "0s" } # Agentic coding tool that lives in your terminal.
xcodes = 'latest'                                           # Command-line tool to install and switch between multiple versions of Xcode.

"spm:blackjacx/assist" = "0.11.1" # App Store Connect API access via CLI written in Swift
"swiftformat" = '0.58.7'          # A code formatter for Swift. ⚠️ We need to explicitly use the ASDF backend here since Mise tries to download SwiftFormat.for.Xcode.app.zip otherwise and as a result the binary cannot be found.

[settings]
color = true # Use color in mise terminal output
all_compile = false # Do not use precompiled binaries for all languages.
always_keep_download = false # Should mise keep downloaded files after installation
always_keep_install = false # Should mise keep install files after installation even if the installation fails
disable_default_registry = false # Disable the default shorthands, see `MISE_DISABLE_DEFAULT_REGISTRY`
disable_tools = [
    "swift",
    "go",
    "python",
] # Disable specific tools, generally used to turn off core tools and the ones loaded by `~/.tool-versions`
not_found_auto_install = true # Set to false to disable the "command not found" handler to autoinstall missing tool versions.
paranoid = false # Enables extra-secure behavior. See https://mise.jdx.dev/paranoid
quiet = false # Suppress all output except errors.
trusted_config_paths = [
] # Config files with these prefixes will be trusted by default
verbose = false # Shows more verbose output such as installation logs when installing tools.
asdf_compat = false # Only output .tool-versions files in mise local|global which will be usable by asdf. This disables mise functionality that would otherwise make these files incompatible with asdf such as non-pinned versions.
yes = true # This will automatically answer yes or no to prompts. This is useful for scripting.
jobs = 5 # Number of plugins or runtimes to install in parallel.
raw = false # Set to true to directly pipe plugins to stdin/stdout/stderr
experimental = true # Enable experimental features
# env_file = '.env'                                       # Load env vars from a dotenv file, see `MISE_ENV_FILE`

# How long to wait before updating plugins automatically.
# This is updated whenever a new runtime is installed.
# (note: this isn't currently implemented but there are plans to add it: https://github.com/jdx/mise/issues/128)
plugin_autoupdate_last_check_duration = "7d" # Set to 0 to disable updates
