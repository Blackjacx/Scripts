# Aerospace Guide: https://nikitabobko.github.io/AeroSpace/guide
# Repo: https://github.com/nikitabobko/AeroSpace
# Goodies: https://nikitabobko.github.io/AeroSpace/goodies

# It's not necessary to copy all keys to your config.
# If the key is missing in your config, "default-config.toml" will serve as a fallback

# You can use it to add commands that run after login to macOS user session.
# 'start-at-login' needs to be 'true' for 'after-login-command' to work
# Available commands: https://nikitabobko.github.io/AeroSpace/commands
after-login-command = []

# You can use it to add commands that run after AeroSpace startup.
# 'after-startup-command' is run after 'after-login-command'
# Available commands : https://nikitabobko.github.io/AeroSpace/commands
after-startup-command = [
    # JankyBorder setup
    'exec-and-forget borders active_color=0xff5e81ac inactive_color=0x00000000 width=6.0',
]

# Start AeroSpace at login
start-at-login = true

# Normalizations. See: https://nikitabobko.github.io/AeroSpace/guide#normalization
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# See: https://nikitabobko.github.io/AeroSpace/guide#layouts
# The 'accordion-padding' specifies the size of accordion padding
# You can set 0 to disable the padding feature
accordion-padding = 15

# Possible values: tiles|accordion
default-root-container-layout = 'accordion'

# Possible values: horizontal|vertical|auto
# 'auto' means: wide monitor (anything wider than high) gets horizontal orientation,
#               tall monitor (anything higher than wide) gets vertical orientation
default-root-container-orientation = 'auto'

# Possible values: (qwerty|dvorak)
# See https://nikitabobko.github.io/AeroSpace/guide#key-mapping
key-mapping.preset = 'qwerty'

# Mouse follows focus when focused monitor changes
# Drop it from your config, if you don't like this behavior
# See https://nikitabobko.github.io/AeroSpace/guide#on-focus-changed-callbacks
# See https://nikitabobko.github.io/AeroSpace/commands#move-mouse
# on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
# on-focus-changed = "move-mouse window-lazy-center"

# Gaps between windows (inner-*) and between monitor edges (outer-*).
# Possible values:
# - Constant:     gaps.outer.top = 8
# - Per monitor:  gaps.outer.top = [{ monitor.main = 16 }, { monitor."some-pattern" = 32 }, 24]
#                 In this example, 24 is a default value when there is no match.
#                 Monitor pattern is the same as for 'workspace-to-monitor-force-assignment'.
#                 See: https://nikitabobko.github.io/AeroSpace/guide#assign-workspaces-to-monitors
[gaps]
inner.horizontal = 12
inner.vertical = 12
outer.left = 12
outer.bottom = 12
outer.top = 12
outer.right = 12

# 'main' binding mode declaration
# See: https://nikitabobko.github.io/AeroSpace/guide#binding-modes
# 'main' binding mode must be always presented
[mode.main.binding]

# All possible keys:
# - Letters.        a, b, c, ..., z
# - Numbers.        0, 1, 2, ..., 9
# - Keypad numbers. keypad0, keypad1, keypad2, ..., keypad9
# - F-keys.         f1, f2, ..., f20
# - Special keys.   minus, equal, period, comma, slash, backslash, quote, semicolon, backtick,
#                   leftSquareBracket, rightSquareBracket, space, enter, esc, backspace, tab
# - Keypad special. keypadClear, keypadDecimalMark, keypadDivide, keypadEnter, keypadEqual,
#                   keypadMinus, keypadMultiply, keypadPlus
# - Arrows.         left, down, up, right

# All possible modifiers: cmd, alt, ctrl, shift

# All possible commands: https://nikitabobko.github.io/AeroSpace/commands

# You can uncomment this line to open up terminal with alt + enter shortcut
# See: https://nikitabobko.github.io/AeroSpace/commands#exec-and-forget
# alt-enter = 'exec-and-forget open -n /System/Applications/Utilities/Terminal.app'


# See: https://nikitabobko.github.io/AeroSpace/commands#workspace
cmd-ctrl-alt-1 = 'workspace --auto-back-and-forth 1'
cmd-ctrl-alt-2 = 'workspace --auto-back-and-forth 2'
cmd-ctrl-alt-3 = 'workspace --auto-back-and-forth 3'
cmd-ctrl-alt-4 = 'workspace --auto-back-and-forth 4'
cmd-ctrl-alt-5 = 'workspace --auto-back-and-forth 5'
cmd-ctrl-alt-6 = 'workspace --auto-back-and-forth 6'
cmd-ctrl-alt-7 = 'workspace --auto-back-and-forth 7'
cmd-ctrl-alt-8 = 'workspace --auto-back-and-forth 8'
cmd-ctrl-alt-9 = 'workspace --auto-back-and-forth 9'
cmd-ctrl-alt-b = 'workspace --auto-back-and-forth B' # browser
cmd-ctrl-alt-d = 'workspace --auto-back-and-forth D' # development
cmd-ctrl-alt-e = 'workspace --auto-back-and-forth E' # explorer / finder
cmd-ctrl-alt-k = 'workspace --auto-back-and-forth K' # keepassxc
cmd-ctrl-alt-l = 'workspace --auto-back-and-forth L' # learning
cmd-ctrl-alt-m = 'workspace --auto-back-and-forth M' # mail
cmd-ctrl-alt-n = 'workspace --auto-back-and-forth N' # notes
cmd-ctrl-alt-o = 'workspace --auto-back-and-forth O' # office
cmd-ctrl-alt-p = 'workspace --auto-back-and-forth P' # preview
cmd-ctrl-alt-s = 'workspace --auto-back-and-forth S' # social
cmd-ctrl-alt-t = 'workspace --auto-back-and-forth T' # terminal

# See: https://nikitabobko.github.io/AeroSpace/commands#move-node-to-workspace
cmd-ctrl-alt-shift-1 = 'move-node-to-workspace 1'
cmd-ctrl-alt-shift-2 = 'move-node-to-workspace 2'
cmd-ctrl-alt-shift-3 = 'move-node-to-workspace 3'
cmd-ctrl-alt-shift-4 = 'move-node-to-workspace 4'
cmd-ctrl-alt-shift-5 = 'move-node-to-workspace 5'
cmd-ctrl-alt-shift-6 = 'move-node-to-workspace 6'
cmd-ctrl-alt-shift-7 = 'move-node-to-workspace 7'
cmd-ctrl-alt-shift-8 = 'move-node-to-workspace 8'
cmd-ctrl-alt-shift-9 = 'move-node-to-workspace 9'
cmd-ctrl-alt-shift-b = 'move-node-to-workspace B'
cmd-ctrl-alt-shift-d = 'move-node-to-workspace D'
cmd-ctrl-alt-shift-e = 'move-node-to-workspace E'
cmd-ctrl-alt-shift-k = 'move-node-to-workspace K'
cmd-ctrl-alt-shift-l = 'move-node-to-workspace L'
cmd-ctrl-alt-shift-m = 'move-node-to-workspace M'
cmd-ctrl-alt-shift-n = 'move-node-to-workspace N'
cmd-ctrl-alt-shift-o = 'move-node-to-workspace O'
cmd-ctrl-alt-shift-p = 'move-node-to-workspace P'
cmd-ctrl-alt-shift-s = 'move-node-to-workspace S'
cmd-ctrl-alt-shift-t = 'move-node-to-workspace T'

# See: https://nikitabobko.github.io/AeroSpace/commands#workspace-back-and-forth
cmd-ctrl-alt-tab = 'workspace-back-and-forth'
# See: https://nikitabobko.github.io/AeroSpace/commands#focus-back-and-forth
cmd-ctrl-alt-backtick = 'focus-back-and-forth'

# See: https://nikitabobko.github.io/AeroSpace/commands#move-workspace-to-monitor
# cmd-ctrl-alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

# See: https://nikitabobko.github.io/AeroSpace/commands#mode
cmd-ctrl-alt-enter = 'fullscreen --no-outer-gaps'
# entering mode move → orange border
cmd-ctrl-alt-semicolon = [
    'mode move',
    'exec-and-forget borders active_color=0xffff9e3b',
]
# entering mode resize → white border
cmd-ctrl-alt-quote = [
    'mode resize',
    'exec-and-forget borders active_color=0xffffffff',
]
# entering mode service → red border
cmd-ctrl-alt-0 = [
    'mode service',
    'exec-and-forget borders active_color=0xffff0000',
]

# Move window to monitor
# See https://nikitabobko.github.io/AeroSpace/commands#move-node-to-monitor 
cmd-ctrl-alt-pageUp = 'move-node-to-monitor next --wrap-around --focus-follows-window'
cmd-ctrl-alt-pageDown = 'move-node-to-monitor prev --wrap-around --focus-follows-window'

# Focus window
# See: https://nikitabobko.github.io/AeroSpace/commands#focus
cmd-ctrl-alt-left = 'focus --boundaries all-monitors-outer-frame --boundaries-action wrap-around-all-monitors left'
cmd-ctrl-alt-down = 'focus --boundaries all-monitors-outer-frame --boundaries-action wrap-around-all-monitors down'
cmd-ctrl-alt-up = 'focus --boundaries all-monitors-outer-frame --boundaries-action wrap-around-all-monitors up'
cmd-ctrl-alt-right = 'focus --boundaries all-monitors-outer-frame --boundaries-action wrap-around-all-monitors right'

[mode.move.binding]

# See: https://nikitabobko.github.io/AeroSpace/commands#layout
slash = ['layout tiles horizontal vertical']
period = ['layout accordion horizontal vertical']

# Join Windows
# See https://nikitabobko.github.io/AeroSpace/commands#join-with
left = ['join-with left']
down = ['join-with down']
up = ['join-with up']
right = ['join-with right']

# Move Window
# See: https://nikitabobko.github.io/AeroSpace/commands#move
shift-left = ['move left']
shift-down = ['move down']
shift-up = ['move up']
shift-right = ['move right']

# every way out → back to blue
esc = ['mode main', 'exec-and-forget borders active_color=0xff5e81ac']

[mode.resize.binding]
left = 'resize width -100'
up = 'resize height +100'
down = 'resize height -100'
right = 'resize width +100'
b = 'balance-sizes'

# See: https://nikitabobko.github.io/AeroSpace/commands#resize
minus = 'resize smart -100'
equal = 'resize smart +100'

# every way out → back to blue
esc = ['mode main', 'exec-and-forget borders active_color=0xff5e81ac']

# 'service' binding mode declaration.
# See: https://nikitabobko.github.io/AeroSpace/guide#binding-modes
[mode.service.binding]

# every way out → back to blue
esc = [
    'reload-config',
    'mode main',
    'exec-and-forget borders active_color=0xff5e81ac',
]

# reset layout
r = [
    'flatten-workspace-tree',
    'mode main',
    'exec-and-forget borders active_color=0xff5e81ac',
]
#s = ['layout sticky tiling', 'mode main'] # sticky is not yet supported https://github.com/nikitabobko/AeroSpace/issues/2
f = ['layout floating tiling'] # Toggle between floating and tiling layout
# backspace = ['close-all-windows-but-current', 'mode main']

[[on-window-detected]]
if.app-id = 'com.google.Chrome'
run = "move-node-to-workspace B"

[[on-window-detected]]
if.app-id = 'com.apple.dt.Xcode'
run = "move-node-to-workspace D"

[[on-window-detected]]
if.app-id = 'com.sublimemerge'
run = "move-node-to-workspace D"

[[on-window-detected]]
if.app-id = 'com.apple.iphonesimulator'
run = "move-node-to-workspace D"

[[on-window-detected]]
if.app-id = 'com.github.CopilotForXcode.ExtensionService'
run = ['move-node-to-workspace D', 'layout floating']

[[on-window-detected]]
if.app-id = 'com.apple.finder'
run = "move-node-to-workspace E"

# Passkey popup: float it, stay on the current workspace
[[on-window-detected]]
if.app-id = 'org.keepassxc.keepassxc'
if.window-title-regex-substring = 'Passkey'
run = 'layout floating'

# Everything else from KeePassXC (main window): workspace K
[[on-window-detected]]
if.app-id = 'org.keepassxc.keepassxc'
run = 'move-node-to-workspace K'

[[on-window-detected]]
if.app-id = 'developer.apple.wwdc-Release'
run = "move-node-to-workspace L"

[[on-window-detected]]
if.app-id = 'md.obsidian'
run = "move-node-to-workspace N"

[[on-window-detected]]
if.app-id = 'com.apple.Notes'
run = "move-node-to-workspace N"

[[on-window-detected]]
if.app-id = 'com.apple.mail'
run = "move-node-to-workspace M"

[[on-window-detected]]
if.app-id = 'com.sublimetext.4'
run = "move-node-to-workspace N"

[[on-window-detected]]
if.app-id = 'com.apple.reminders'
run = "move-node-to-workspace O"

[[on-window-detected]]
if.app-id = 'com.apple.iCal'
run = "move-node-to-workspace O"

[[on-window-detected]]
if.app-id = 'com.apple.Preview'
run = "move-node-to-workspace P"

[[on-window-detected]]
if.app-id = 'com.tinyspeck.slackmacgap'
run = "move-node-to-workspace S"

[[on-window-detected]]
if.app-id = 'com.microsoft.teams2'
run = "move-node-to-workspace S"

[[on-window-detected]]
if.app-id = 'net.whatsapp.WhatsApp'
run = "move-node-to-workspace S"

[[on-window-detected]]
if.app-id = 'org.whispersystems.signal-desktop'
run = "move-node-to-workspace S"

[[on-window-detected]]
if.app-id = 'com.mitchellh.ghostty'
run = "move-node-to-workspace T"

[[on-window-detected]]
if.app-id = 'org.sbarex.SourceCodeSyntaxHighlight'
run = ['layout floating']
